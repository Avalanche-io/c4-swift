name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main, 'release/**']

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --experimental-event-stream-output "$RUNNER_TEMP/events.jsonl" --experimental-event-stream-version 0
      # Every skip, with its reason; a skip Scripts/allowed-skips.txt does not
      # name fails the job. Runs when the tests failed too.
      - if: success() || failure()
        run: swift Scripts/skips.swift Scripts/allowed-skips.txt "$RUNNER_TEMP/events.jsonl"
